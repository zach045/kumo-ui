name: Frontend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [kumo-001]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Block high-severity dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
